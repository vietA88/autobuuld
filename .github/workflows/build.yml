name: Build AutoBuild Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and Setup Gradle
        run: |
          # Tải Gradle 8.5 trực tiếp về máy build (không cần file wrapper)
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle.zip
          unzip -q gradle.zip
          mv gradle-8.5 /opt/gradle-8.5
          ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Build with Gradle
        run: gradle jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobuild-mod-jar
          path: build/libs/*.jar
          retention-days: 7
