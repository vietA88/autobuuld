name: Build AutoBuild Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # SỬA LẠI ĐƯỜNG DẪN TỪ actions/setup-gradle -> gradle/setup-gradle
      - name: Setup Gradle
        uses: gradle/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build with Gradle
        run: gradle jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobuild-mod-jar
          path: build/libs/*.jar
          retention-days: 7
